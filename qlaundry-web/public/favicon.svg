<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- Background -->
    <rect width="32" height="32" rx="8" fill="#042233"/>
    <!-- Machine body -->
    <rect x="5" y="5" width="22" height="22" rx="3.5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Top panel separator -->
    <line x1="5" y1="11.5" x2="27" y2="11.5" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Control indicators -->
    <circle cx="9.5" cy="8.5" r="1.5" fill="#38bdf8"/>
    <circle cx="14" cy="8.5" r="1.5" fill="#0ea5e9" opacity="0.6"/>
    <!-- Door ring -->
    <circle cx="16" cy="19.5" r="6.5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Door inner highlight -->
    <circle cx="16" cy="19.5" r="3.5" fill="#38bdf8" opacity="0.2"/>
    <!-- Spin arc (water swish) -->
    <path d="M14 17.5 Q16 16 18 17.5" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
</svg>
