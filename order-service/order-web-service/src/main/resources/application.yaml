spring:
  application:
    name: order-web-service
  datasource:
    url: jdbc:postgresql://localhost:5432/qlaundry?currentSchema=orders
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      password: '12345'
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8103

logging:
  file:
    name: logs/order-web-service.log

app:
  promotion:
    saga:
      # how far past updated_at a PENDING saga row must be before the sweeper touches it — must stay well past
      # every timeout on the create path, or an in-flight create gets swept
      grace-period: 90m
      sweep-batch-size: 100
      # @Scheduled reads this as a plain number of hours (see OrderPromotionSagaScheduler)
      sweep-interval-hours: 1
  analytics:
    stream:
      event:
        # must match analytics-service's app.analytics.stream.event.key; full stream name is key + AGGREGATE
        key: 'analytics:event:'
    outbox:
      # how long a CREATED (not-yet-published) analytics_events row sits before the sweeper republishes it —
      # long enough that an in-flight afterCommit publish is never raced
      grace-period: 2m
      sweep-batch-size: 200
      # @Scheduled reads this as a plain number of minutes (see AnalyticsOutboxScheduler)
      sweep-interval-minutes: 5
      backfill-batch-size: 500
    backfill:
      # only read by the analytics-backfill profile; blank means every tenant
      tenant-id: ''
  internal:
    # credential for the /internal/** call into user-service, as <clientId>:<version>:<secret>. user-service stores
    # only the SHA-256 of the secret part. Rotating means pointing this at a new version that user-service already
    # accepts, then restarting — dev-only here, use APP_INTERNAL_API_KEY elsewhere
    api-key: 'order:v1:dev-internal-2f8c41b9a7d3e56c0b1f9a4d8e7c6b52'
    user-service:
      base-url: 'http://localhost:8101'
      timeout: 5s
    # promotion-service keeps its own digest set, so this is a second, independent credential — rotating one
    # never touches the other
    promotion-api-key: 'order:v1:dev-internal-9c4a71e0f5b2d836a1e74c9b02f6d5a3'
    promotion-service:
      base-url: 'http://localhost:8104'
      timeout: 5s
  crypto:
    # dev-only keys, independent from user-service's — the services never read each other's rows
    # (APP_CRYPTO_ACTIVE_KEY_ID, APP_CRYPTO_KEYS_V1, APP_CRYPTO_BLIND_INDEX_KEY, ...); generate with `openssl rand -base64 32`
    active-key-id: v1
    # order-service has never stored a plaintext row — there is no migration window to read through
    allow-plaintext-read: false
    blind-index-key: 'Uo9OFf9tX0mfZ0K3hM4EQvVKlbUYnDXfJf6bMLTHBSM='
    keys:
      v1: 'p6UBqZ5cTflVJyYQZgpQoxKF8L3vJhhkPFbBBIm2Wt0='
  invoice:
    link:
      # HMAC secret behind the short-lived presigned invoice link (GET /invoice/pdf?token=…). The link is
      # the only unauthenticated route in this service, so rotating this secret instantly invalidates every
      # outstanding link. dev-only here — use APP_INVOICE_LINK_SECRET elsewhere; `openssl rand -base64 32`
      secret: 'kK1n8xQ2vR7pLzT4mYwB9sHdF0gJc6XeA3uNqOiZrV8='
  token:
    # the public half of user-service's RS256 key pair — this service only verifies access tokens
    public-key: "MCowBQYDK2VwAyEAewlqN7GKlxKGgyXUobhnMF+76ytxBpSKYX+r3bYMaVM="
