spring:
  application:
    name: analytics-web-service
  data:
    redis:
      host: localhost
      port: 6379
      password: '12345'
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8105

logging:
  file:
    name: logs/analytics-web-service.log

app:
  clickhouse:
    # the ClickHouse container from analytics-service/docker-compose.yml — dev-only credentials
    url: 'http://localhost:8123'
    database: qlaundry_analytics
    username: analytics
    password: '12345'
    timeout: 10s
  analytics:
    stream:
      event:
        # must match order-service's app.analytics.stream.event.key; full stream name is key + AGGREGATE
        key: 'analytics:event:'
        group: analytics-service
        consumer: analytics-1
        retention-days: 7
        # daily XTRIM MINID cron for both event streams and both DLQs (see AnalyticsStreamTrimScheduler)
        trim-cron: '0 45 3 * * *'
        reclaim:
          # after this many failed deliveries a pending entry is dead-lettered instead of retried again
          max-deliveries: 5
          # how long a pending entry must sit idle before AnalyticsPelReclaimScheduler claims it
          min-idle: 60s
          # XPENDING page size per stream, per tick
          batch-size: 100
          # @Scheduled reads this as a plain number of minutes (see AnalyticsPelReclaimScheduler)
          interval-minutes: 1
  token:
    # the public half of user-service's RS256 key pair — this service only verifies access tokens
    public-key: "MCowBQYDK2VwAyEAewlqN7GKlxKGgyXUobhnMF+76ytxBpSKYX+r3bYMaVM="
