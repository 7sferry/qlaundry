spring:
  application:
    name: notification-web-service
  datasource:
    url: jdbc:postgresql://localhost:5432/qlaundry?currentSchema=notif
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      password: '12345'
  mail:
    host: smtp.gmail.com
    port: 587
    username: email@email.com
    password: 'password'
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8102

logging:
  file:
    name: logs/notification-web-service.log

app:
  crypto:
    # dev-only keys, independent from user-service's — the two services never read each other's rows
    # (APP_CRYPTO_ACTIVE_KEY_ID, APP_CRYPTO_KEYS_V1, APP_CRYPTO_BLIND_INDEX_KEY, ...); generate with `openssl rand -base64 32`
    active-key-id: v1
    # read-through for pre-encryption plaintext rows; flip to false once the backfill profile has run
    allow-plaintext-read: true
    blind-index-key: 'jOYybWvudnVsMxcJUzZyoWvosgbN0hXHveyq/nUUqYc='
    keys:
      v1: 'J2LDhmCTROzotYye8FumETQvyIbTxDFmML07lbY0GKw='
  mail:
    sender: email@email.com
  notification:
    confirmation:
      base-url: http://localhost:8100
    stream:
      email:
        key: 'notification:email:'
        group: notification-service
        consumer: notification-web-service-1
        retention-days: 7
