spring:
  application:
    name: user-web-service
  datasource:
    url: jdbc:postgresql://localhost:5432/qlaundry?currentSchema=users
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      password: '12345'
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8101

logging:
  file:
    name: logs/user-web-service.log

app:
  crypto:
    # dev-only keys — anything shared/production must come from the environment
    # (APP_CRYPTO_ACTIVE_KEY_ID, APP_CRYPTO_KEYS_V1, APP_CRYPTO_BLIND_INDEX_KEY, ...); generate with `openssl rand -base64 32`
    active-key-id: v1
    # read-through for pre-encryption plaintext rows; flip to false once the backfill profile has run
    allow-plaintext-read: true
    blind-index-key: 'wvDlYLRAI5G7K3D1HkDZTEO9cqJ6Q7vmHCiBO50YhVA='
    keys:
      v1: 'QmfUJe4HNHNpsPfT9RRR0QvceqSPAYdhE5shmrWD2vI='
  internal:
    # SHA-256 (hex) of each caller's secret — never the secret itself, so a dump of this file yields nothing usable.
    # Break-glass only: this set is consulted just when Redis is unreachable. Live rotation and revocation happen
    # against `user:internal:key:<clientId>:<version>` in Redis (see "Rotating an internal key" in CLAUDE.md).
    # digest of the dev secret: printf '%s' "$SECRET" | sha256sum
    clients:
      order:
        v1: 'e24b5b12e47219f45c43ce3c999d69cd3c5478b6d2fed822cd0cf4e3ea345b5e'
  notification:
    stream:
      email:
        key: 'notification:email:'
  turnstile:
    secret-key: 'xxx'
    verify-url: 'https://challenges.cloudflare.com/turnstile/v0/siteverify'
  token:
    private-key: "MC4CAQAwBQYDK2VwBCIEIEo7KmfyKG/FJkXL0azelx1Oobn88YEdhyay6QQEeO78"
    public-key: "MCowBQYDK2VwAyEAewlqN7GKlxKGgyXUobhnMF+76ytxBpSKYX+r3bYMaVM="
    refresh-duration-in-seconds: 600
    rotation-duration-before-expire-in-seconds: 300
    access-duration-in-seconds: 120
