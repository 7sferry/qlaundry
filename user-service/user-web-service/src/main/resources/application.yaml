spring:
  application:
    name: user-web-service
  datasource:
    url: jdbc:postgresql://localhost:5432/qlaundry?currentSchema=users
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      password: '12345'
  threads:
    virtual:
      enabled: true

server:
  port: 8101

app:
  notification:
    stream:
      email:
        key: 'notification:email:'
  token:
    private-key: ""
    public-key: ""
    refresh-duration-in-seconds: 600
    rotation-duration-before-expire-in-seconds: 300
    access-duration-in-seconds: 120
