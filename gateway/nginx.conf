worker_processes auto;

events {
	worker_connections 1024;
}

# The published port (443, mapped to host 8100) is owned by this stream
# server, not by the http server below. It peeks at the first bytes of each
# connection (ssl_preread, no cert needed here) to tell a TLS ClientHello
# from a plain-text HTTP request line, then hands the raw bytes off to one
# of two internal, unpublished http servers: the real app on 8443, or a
# redirect-only server on 8080. This is what lets http://localhost:8100 and
# https://localhost:8100 both work on the exact same host port.
stream {
	map $ssl_preread_protocol $gateway_backend {
		default https_backend;
		""      http_backend;
	}

	upstream https_backend {
		server 127.0.0.1:8443;
	}

	upstream http_backend {
		server 127.0.0.1:8080;
	}

	server {
		listen 443;
		proxy_pass $gateway_backend;
		ssl_preread on;
	}
}

http {
	upstream user_service {
		least_conn;
		server host.docker.internal:8101;
	}

	# upstream notification_service {
	# 	server host.docker.internal:8102;
	# }

	upstream order_service {
		least_conn;
		server host.docker.internal:8103;
	}

	upstream promotion_service {
		least_conn;
		server host.docker.internal:8104;
	}

	upstream frontend_dev {
		server host.docker.internal:5173;
	}

	# Redirect-only: whatever the stream server above forwards here arrived
	# as plain HTTP. $http_host (not $host) keeps the port the client
	# actually connected to, so http://localhost:8100/x redirects to
	# https://localhost:8100/x rather than dropping the port.
	server {
		listen 127.0.0.1:8080;
		server_name localhost;
		return 301 https://$http_host$request_uri;
	}

	server {
		listen 127.0.0.1:8443 ssl;
		ssl_certificate     /etc/nginx/certs/dev.crt;
		ssl_certificate_key /etc/nginx/certs/dev.key;

		server_name localhost;

		location /api/auth/ {
			proxy_pass http://user_service/auth/;
			proxy_cookie_path /auth /api/auth;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/staff/ {
			proxy_pass http://user_service/staff/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/customer/ {
			proxy_pass http://user_service/customer/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/order/ {
			proxy_pass http://order_service/order/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/invoice/ {
			proxy_pass http://order_service/invoice/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/public/invoice/ {
			proxy_pass http://order_service/public/invoice/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/service/ {
			proxy_pass http://order_service/service/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/promotion/ {
			proxy_pass http://promotion_service/promotion/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# location /api/notifications/ {
		# 	proxy_pass http://notification_service/;
		# 	...
		# }

		location / {
			proxy_pass http://frontend_dev;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}
